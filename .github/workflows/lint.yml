name: Lint

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    name: Super Linter
    uses: harryzcy/github-actions/.github/workflows/linter.yml@fae1858434c87b9cf10fe8a78af1b57ebddd9666 # main

  go-lint:
    name: Go Lint
    uses: harryzcy/github-actions/.github/workflows/golangci-lint.yml@fae1858434c87b9cf10fe8a78af1b57ebddd9666 # main
    with:
      working-directory: bff

  prettier:
    name: Prettier
    uses: harryzcy/github-actions/.github/workflows/prettier.yml@fae1858434c87b9cf10fe8a78af1b57ebddd9666 # main
    with:
      working-directory: web

  oxlint:
    name: Oxlint
    uses: harryzcy/github-actions/.github/workflows/npm-lint.yml@fae1858434c87b9cf10fe8a78af1b57ebddd9666 # main
    with:
      working-directory: web

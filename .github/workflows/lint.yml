name: Lint

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    name: Super Linter
    uses: harryzcy/github-actions/.github/workflows/linter.yml@adf1da47485b8d56cb1e16a6a7850ccf4633b39a # main

  go-lint:
    name: Go Lint
    uses: harryzcy/github-actions/.github/workflows/golangci-lint.yml@adf1da47485b8d56cb1e16a6a7850ccf4633b39a # main
    with:
      working-directory: bff

  prettier:
    name: Prettier
    uses: harryzcy/github-actions/.github/workflows/prettier.yml@adf1da47485b8d56cb1e16a6a7850ccf4633b39a # main
    with:
      working-directory: web

  oxlint:
    name: Oxlint
    uses: harryzcy/github-actions/.github/workflows/npm-lint.yml@adf1da47485b8d56cb1e16a6a7850ccf4633b39a # main
    with:
      working-directory: web

name: Lint

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    name: Super Linter
    uses: harryzcy/github-actions/.github/workflows/linter.yml@b53d39412a62ade5c6757064576d72f2ea7e41e5 # main

  go-lint:
    name: Go Lint
    uses: harryzcy/github-actions/.github/workflows/golangci-lint.yml@b53d39412a62ade5c6757064576d72f2ea7e41e5 # main
    with:
      working-directory: bff

  prettier:
    name: Prettier
    uses: harryzcy/github-actions/.github/workflows/prettier.yml@b53d39412a62ade5c6757064576d72f2ea7e41e5 # main
    with:
      working-directory: web

  oxlint:
    name: Oxlint
    uses: harryzcy/github-actions/.github/workflows/npm-lint.yml@b53d39412a62ade5c6757064576d72f2ea7e41e5 # main
    with:
      working-directory: web
